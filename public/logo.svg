<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="brand" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C8E0"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="46" fill="url(#brand)"/>

  <!-- Compass rose — outer ring -->
  <circle cx="100" cy="100" r="56" fill="none" stroke="white" stroke-width="8" opacity="0.22"/>

  <!-- North pointer (emphasized — "pursuing upward") -->
  <polygon points="100,38 86,80 100,70 114,80" fill="white"/>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="10" fill="white"/>

  <!-- South, East, West accent dots -->
  <circle cx="100" cy="162" r="5.5" fill="white" opacity="0.3"/>
  <circle cx="38" cy="100" r="5.5" fill="white" opacity="0.3"/>
  <circle cx="162" cy="100" r="5.5" fill="white" opacity="0.3"/>
</svg>
