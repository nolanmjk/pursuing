<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.03)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <rect width="800" height="400" fill="url(#shine)"/>
  <!-- Decorative lines -->
  <line x1="60" y1="340" x2="200" y2="340" stroke="#4DB8D4" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="340" x2="740" y2="340" stroke="#4DB8D4" stroke-width="1" opacity="0.3"/>
  <circle cx="220" cy="340" r="3" fill="#4DB8D4" opacity="0.4"/>
  <circle cx="580" cy="340" r="3" fill="#4DB8D4" opacity="0.4"/>
  <!-- University name -->
  <text x="400" y="195" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="52" font-weight="700" letter-spacing="6">山东大学</text>
  <!-- English subtitle -->
  <text x="400" y="240" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="'Segoe UI',sans-serif" font-size="14" letter-spacing="4">UNIVERSITY</text>
  <!-- Bottom accent bar -->
  <rect x="320" y="360" width="160" height="2" rx="1" fill="#4DB8D4" opacity="0.3"/>
</svg>